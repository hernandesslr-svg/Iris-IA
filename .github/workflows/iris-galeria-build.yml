name: Compilar Iris Galeria APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout galeria
        uses: actions/checkout@v4
        with:
          ref: iris-galeria
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Instalar SDK Android 35
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true
      - name: Compilar APK
        working-directory: iris-galeria/android
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace --console=plain --refresh-dependencies 2>&1 | tee build.log
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Diagnosticar falha
        if: failure()
        run: |
          echo "Compilacao falhou; confira a etapa acima e os logs publicados."
          find iris-galeria/android -maxdepth 5 -type f -name "*.log" -print || true
      - name: Publicar log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Iris-Galeria-build-log
          path: iris-galeria/android/build.log
          if-no-files-found: warn
      - name: Verificar APK gerado
        run: test -s iris-galeria/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Iris-Galeria-debug-apk
          path: iris-galeria/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
