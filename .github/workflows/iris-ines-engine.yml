name: Iris Ines - validar motor de voz offline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/iris-ines-engine.yml'
      - 'iris-ui/IrisInesVoice.kt'

permissions:
  contents: read

jobs:
  verify-ines:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Preparar ONNX Runtime 1.27
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/ort.tgz https://github.com/microsoft/onnxruntime/releases/download/v1.27.0/onnxruntime-linux-x64-1.27.0.tgz
          mkdir -p /tmp/ort
          tar -xzf /tmp/ort.tgz -C /tmp/ort --strip-components=1
          echo "ORT_DYLIB_PATH=/tmp/ort/lib/libonnxruntime.so" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/tmp/ort/lib" >> "$GITHUB_ENV"
      - name: Compilar motor Loudkit Rust
        run: |
          git clone --depth 1 --branch v0.1.1 https://github.com/loudreader/loudkit.git /tmp/loudkit
          cd /tmp/loudkit/rust
          cargo build --release --example hello
      - name: Sintetizar amostra real da Ines
        run: |
          mkdir -p /tmp/loudkit/rust/examples
          cat > /tmp/loudkit/rust/examples/iris_ines.rs <<'RS'
          use loudkit::engine::{Engine, Options};
          fn main() -> Result<(), String> {
              let mut engine = Engine::load("loudreader/loudr-1-turbo")?;
              let voice = engine.voice("ines")?;
              let audio = engine.synthesize(
                  "Olá! Eu sou a Iris. Esta é a minha voz em português brasileiro.",
                  &voice,
                  &Options::default(),
              )?;
              audio.save_wav("ines-pt-br.wav")?;
              Ok(())
          }
          RS
          cd /tmp/loudkit/rust
          cargo run --locked --release --example iris_ines
          test -s ines-pt-br.wav
          cp ines-pt-br.wav "$GITHUB_WORKSPACE/ines-pt-br.wav"
      - uses: actions/upload-artifact@v4
        with:
          name: iris-ines-amostra-pt-br
          path: ines-pt-br.wav
          if-no-files-found: error

  android-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Preparar toolchain Rust Android
        run: |
          rustup target add aarch64-linux-android
          test -d "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_AR=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar" >> "$GITHUB_ENV"
      - name: Compilar Loudkit para Android ARM64
        run: |
          git clone --depth 1 --branch v0.1.1 https://github.com/loudreader/loudkit.git /tmp/loudkit
          cd /tmp/loudkit/rust
          cargo build --locked --release --target aarch64-linux-android --lib
      - name: Confirmar biblioteca compilada
        run: |
          test -s /tmp/loudkit/rust/target/aarch64-linux-android/release/libloudkit.rlib
          file /tmp/loudkit/rust/target/aarch64-linux-android/release/libloudkit.rlib
