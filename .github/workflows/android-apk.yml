name: Iris Android - compilar prototipo
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Instalar Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extrair codigo nativo da Iris
        run: |
          python3 - <<'PY'
          import zipfile, pathlib
          archive = pathlib.Path('Iris-Android-preparado-para-GitHub.zip')
          with zipfile.ZipFile(archive) as z:
              for item in z.infolist():
                  if item.is_dir(): continue
                  path = pathlib.PurePosixPath(item.filename)
                  if not path.parts or path.parts[0] != 'Iris-Android': continue
                  dest = pathlib.Path(*path.parts[1:])
                  if not dest.parts or '..' in dest.parts: raise ValueError(item.filename)
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(z.read(item))
          PY
      - name: Compilar Iris Android (sem inferencia neural)
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: iris-android-prototipo-sem-neural
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
