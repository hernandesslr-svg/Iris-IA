name: IRIS neural conversation training
on:
  push:
    paths:
      - 'iris-neural/**'
      - '.github/workflows/iris-neural-training.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PyTorch CPU
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Train with full conversation corpus and held-out evaluation
        run: |
          cd iris-neural
          python train_full_conversation.py --steps 3000 --context 64 --batch-size 4 --output-dir artifacts
      - name: Save model and evaluation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iris-neural-training
          path: iris-neural/artifacts/
          retention-days: 30
