name: Iris Android - gerar APK de teste

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Iris-Android-preparado-para-GitHub.zip'
      - 'iris-native/**'
      - 'iris-ui/**'
      - '.github/workflows/iris-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
      - name: Extrair projeto Iris com seguranca
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path, PurePosixPath
          archive = Path("Iris-Android-preparado-para-GitHub.zip")
          with ZipFile(archive) as z:
              for info in z.infolist():
                  if info.is_dir(): continue
                  path = PurePosixPath(info.filename)
                  if not path.parts or path.parts[0] != "Iris-Android": continue
                  rel = path.parts[1:]
                  if not rel or any(p in (".", "..") for p in rel): raise ValueError(info.filename)
                  out = Path("android-project").joinpath(*rel)
                  out.parent.mkdir(parents=True, exist_ok=True)
                  out.write_bytes(z.read(info))
          assert Path("android-project/settings.gradle.kts").exists()
          assert Path("android-project/app/build.gradle.kts").exists()
          PY
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Baixar Qwen3 1.7B Q4_K_M diretamente do Hugging Face
        env:
          HF_REPO: unsloth/Qwen3-1.7B-GGUF
          HF_FILE: Qwen3-1.7B-Q4_K_M.gguf
        run: |
          python3 -m pip install --quiet huggingface_hub
          python3 - <<'PY'
          from huggingface_hub import hf_hub_download
          from pathlib import Path
          import os, shutil
          source = hf_hub_download(repo_id=os.environ["HF_REPO"], filename=os.environ["HF_FILE"])
          assert Path(source).stat().st_size > 900_000_000, "Modelo incompleto"
          dest = Path("android-project/app/src/main/assets/qwen3-1.7b-q4.gguf")
          dest.parent.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(source, dest)
          print("Modelo GGUF incluído nos assets:", dest.stat().st_size, "bytes")
          PY
      - name: Evitar compactacao GGUF e estouro de memoria
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android-project/app/build.gradle.kts")
          s = p.read_text()
          if 'noCompress += "gguf"' not in s:
              s += '\nandroid { androidResources { noCompress += "gguf" } }\n'
          p.write_text(s)
          props = Path("android-project/gradle.properties")
          existing = props.read_text() if props.exists() else ""
          existing = "\n".join(line for line in existing.splitlines() if not line.startswith("org.gradle.jvmargs="))
          props.write_text(existing + "\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8\norg.gradle.workers.max=2\n")
          PY
      - name: Integrar llama.cpp JNI e conversa offline
        run: |
          set -e
          git clone --depth 1 --branch master https://github.com/ggml-org/llama.cpp.git android-project/app/src/main/cpp/llama.cpp
          cp iris-native/iris_native.cpp android-project/app/src/main/cpp/
          cp iris-native/CMakeLists.txt android-project/app/src/main/cpp/
          cp iris-native/IrisNeuralCore.kt android-project/app/src/main/java/com/iris/assistant/IrisNeuralCore.kt
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android-project/app/build.gradle.kts")
          s=p.read_text()
          s += """
          android {
              defaultConfig { ndk { abiFilters += listOf("arm64-v8a") } }
              externalNativeBuild { cmake { path = file("src/main/cpp/CMakeLists.txt") } }
          }
          """
          p.write_text(s)
          p=Path("android-project/app/src/main/java/com/iris/assistant/MainActivity.kt")
          s=p.read_text()
          old='val answer=neural.generateOrNull(msg) ?: respond(msg); addMessage("Iris",answer); if(speechReady) tts?.speak(answer,TextToSpeech.QUEUE_FLUSH,null,"iris") ;scroll.post { scroll.fullScroll(View.FOCUS_DOWN) }'
          new='''Thread {
              val answer = try { neural.generateOrNull(msg) ?: respond(msg) }
                  catch (e: Exception) { "Falha no modelo neural: ${e.message}" }
              runOnUiThread {
                  if (!isFinishing && !isDestroyed) {
                      addMessage("Iris",answer)
                      if(speechReady) tts?.speak(answer,TextToSpeech.QUEUE_FLUSH,null,"iris")
                      scroll.post { scroll.fullScroll(View.FOCUS_DOWN) }
                  }
              }
          }.start()'''
          assert old in s
          p.write_text(s.replace(old,new).replace('override fun onDestroy(){ tts?.shutdown();', 'override fun onDestroy(){ neural.close(); tts?.shutdown();'))
          PY
      - name: Aplicar interface holografica Iris
        run: |
          cp iris-ui/IrisHudView.kt android-project/app/src/main/java/com/iris/assistant/IrisHudView.kt
          cp iris-ui/IrisVoiceService.kt android-project/app/src/main/java/com/iris/assistant/IrisVoiceService.kt
          cp iris-ui/IrisDeviceControl.kt android-project/app/src/main/java/com/iris/assistant/IrisDeviceControl.kt
          cp iris-ui/IrisMemory.kt android-project/app/src/main/java/com/iris/assistant/IrisMemory.kt
          cp iris-ui/IrisIntent.kt android-project/app/src/main/java/com/iris/assistant/IrisIntent.kt
          cp iris-ui/IrisStatisticalModel.kt android-project/app/src/main/java/com/iris/assistant/IrisStatisticalModel.kt
          python3 iris-ui/apply_ui.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android-project/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          permissions = '<uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE"/>'
          s=s.replace('<application',permissions+'\n    <application',1)
          service = '<service android:name=".IrisVoiceService" android:exported="false" android:foregroundServiceType="microphone"/>'
          s=s.replace('</application>',service+'\n    </application>',1)
          s=s.replace('<manifest', '<manifest', 1)
          s=s.replace('<application', '<queries><intent><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent></queries>\n    <application',1)
          p.write_text(s)
          PY
      - name: Compilar APK debug da Iris
        working-directory: android-project
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Publicar APK para teste
        uses: actions/upload-artifact@v4
        with:
          name: iris-android-qwen3-neural-jni
          path: android-project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
