name: Iris Android - gerar APK de teste

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Iris-Android-preparado-para-GitHub.zip'
      - 'iris-native/**'
      - 'iris-ui/**'
      - '.github/workflows/iris-android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
      - name: Extrair projeto Iris com seguranca
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path, PurePosixPath
          archive = Path("Iris-Android-preparado-para-GitHub.zip")
          with ZipFile(archive) as z:
              for info in z.infolist():
                  if info.is_dir(): continue
                  path = PurePosixPath(info.filename)
                  if not path.parts or path.parts[0] != "Iris-Android": continue
                  rel = path.parts[1:]
                  if not rel or any(p in (".", "..") for p in rel): raise ValueError(info.filename)
                  out = Path("android-project").joinpath(*rel)
                  out.parent.mkdir(parents=True, exist_ok=True)
                  out.write_bytes(z.read(info))
          assert Path("android-project/settings.gradle.kts").exists()
          assert Path("android-project/app/build.gradle.kts").exists()
          PY
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Remover recursos antigos de modelos externos
        run: |
          python3 - <<'PY'
          from pathlib import Path
          base=Path("android-project/app/src/main")
          for pattern in ("*.gguf","*qwen*","*llama*"):
              for path in base.rglob(pattern):
                  if path.is_file(): path.unlink()
          PY
      - name: Instalar MediaPipe e modelo de maos offline
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android-project/app/build.gradle.kts")
          s=p.read_text()
          s += '\n dependencies { implementation("com.google.mediapipe:tasks-vision:0.10.14") }\n'
          p.write_text(s)
          PY
          mkdir -p android-project/app/src/main/assets
          curl --fail --location --retry 3 --output android-project/app/src/main/assets/hand_landmarker.task https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task
          test $(stat -c%s android-project/app/src/main/assets/hand_landmarker.task) -gt 1000000
      - name: Aplicar interface holografica Iris
        run: |
          cp iris-ui/IrisHudView.kt android-project/app/src/main/java/com/iris/assistant/IrisHudView.kt
          cp iris-ui/IrisVoiceService.kt android-project/app/src/main/java/com/iris/assistant/IrisVoiceService.kt
          cp iris-ui/IrisFixedVoice.kt android-project/app/src/main/java/com/iris/assistant/IrisFixedVoice.kt
          cp iris-ui/IrisInesSpeech.kt android-project/app/src/main/java/com/iris/assistant/IrisInesSpeech.kt
          cp iris-ui/IrisDeviceControl.kt android-project/app/src/main/java/com/iris/assistant/IrisDeviceControl.kt
          cp iris-ui/IrisMemory.kt android-project/app/src/main/java/com/iris/assistant/IrisMemory.kt
          cp iris-ui/IrisIntent.kt android-project/app/src/main/java/com/iris/assistant/IrisIntent.kt
          cp iris-ui/IrisStatisticalModel.kt android-project/app/src/main/java/com/iris/assistant/IrisStatisticalModel.kt
          cp iris-ui/IrisTrigramGenerator.kt android-project/app/src/main/java/com/iris/assistant/IrisTrigramGenerator.kt
          cp iris-ui/IrisAudioGate.kt android-project/app/src/main/java/com/iris/assistant/IrisAudioGate.kt
          cp iris-ui/IrisOneEuro.kt android-project/app/src/main/java/com/iris/assistant/IrisOneEuro.kt
          cp iris-ui/IrisClapDetector.kt android-project/app/src/main/java/com/iris/assistant/IrisClapDetector.kt
          cp iris-ui/IrisFillers.kt android-project/app/src/main/java/com/iris/assistant/IrisFillers.kt
          cp iris-ui/IrisCapabilities.kt android-project/app/src/main/java/com/iris/assistant/IrisCapabilities.kt
          cp iris-ui/IrisVoiceDiagnostics.kt android-project/app/src/main/java/com/iris/assistant/IrisVoiceDiagnostics.kt
          cp iris-ui/IrisJarvisToolkit.kt android-project/app/src/main/java/com/iris/assistant/IrisJarvisToolkit.kt
          cp iris-ui/IrisAudioLevel.kt android-project/app/src/main/java/com/iris/assistant/IrisAudioLevel.kt
          cp iris-ui/IrisCameraGestures.kt android-project/app/src/main/java/com/iris/assistant/IrisCameraGestures.kt
          cp iris-ui/IrisHandLandmarks.kt android-project/app/src/main/java/com/iris/assistant/IrisHandLandmarks.kt
          cp iris-ui/IrisSoundscape.kt android-project/app/src/main/java/com/iris/assistant/IrisSoundscape.kt
          mkdir -p android-project/app/src/main/assets/licenses
          cp iris-ui/JARVIS-LICENSE.txt android-project/app/src/main/assets/licenses/JARVIS-LICENSE.txt
          python3 iris-ui/apply_ui.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android-project/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          permissions = '<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE"/>'
          s=s.replace('<application',permissions+'\n    <application',1)
          service = '<service android:name=".IrisVoiceService" android:exported="false" android:foregroundServiceType="microphone"/>'
          s=s.replace('</application>',service+'\n    </application>',1)
          s=s.replace('<manifest', '<manifest', 1)
          s=s.replace('<application', '<queries><intent><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent></queries>\n    <application',1)
          p.write_text(s)
          PY
      - name: Restaurar pesos treinados originais da Iris
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          import json
          installed=Path("android-project/app/src/main/assets/iris-lm-weights.json")
          committed=Path("iris-ui/assets/iris-lm-weights.json")
          if committed.is_file():
              installed.parent.mkdir(parents=True,exist_ok=True)
              installed.write_bytes(committed.read_bytes())
              print("Pesos Iris copiados do repositorio:",installed.stat().st_size,"bytes")
          if installed.is_file():
              weights=json.loads(installed.read_text(encoding="utf-8"))
              assert all(weights.get(k) for k in ("topic","mood","gen")), "Pesos preinstalados invalidos"
              print("Pesos ORIGINAIS ja presentes no projeto Android:",installed.stat().st_size,"bytes")
              raise SystemExit(0)
          if not Path("iris-IA.zip").exists():
              print("::warning title=Pesos Iris ausentes::Nao ha pesos originais no checkout; o motor estatistico usara fallback.")
              raise SystemExit(0)
          with ZipFile("iris-IA.zip") as z:
              source=z.read("src/lib/iris-lm-weights.ts").decode("utf-8")
          marker="export const LM_WEIGHTS: LMWeights = "
          assert marker in source, "Pesos do modelo Iris não encontrados"
          raw=source.split(marker,1)[1].strip()
          assert raw.endswith(";"), "Formato inesperado dos pesos Iris"
          weights=json.loads(raw[:-1])
          assert "topic" in weights and "mood" in weights and "gen" in weights
          assert len(weights["topic"]["classes"])>=30
          assert weights["topic"]["feats"] and weights["mood"]["feats"]
          assets=Path("android-project/app/src/main/assets")
          assets.mkdir(parents=True,exist_ok=True)
          target=assets/"iris-lm-weights.json"
          target.write_text(json.dumps(weights,ensure_ascii=False,separators=(",",":")),encoding="utf-8")
          print("Pesos originais Iris incluídos:",target.stat().st_size,"bytes")
          print("Assuntos:",len(weights["topic"]["classes"]),"Emoções:",len(weights["mood"]["classes"]))
          PY
      - name: Preparar modelo Loudkit Ines offline
        run: |
          python3 -m pip install --quiet huggingface_hub
          python3 - <<'PY'
          from huggingface_hub import snapshot_download
          from pathlib import Path
          import shutil
          required=[
              "manifest.json", "release.json", "tokenizer.json",
              "loudr-1-turbo.safetensors", "voices/ines.safetensors",
              "onnx/t3_cond.onnx", "onnx/t3_prefill.onnx",
              "onnx/t3_pair_step.onnx", "onnx/t3_head2.onnx", "onnx/flow_encoder.onnx",
              "onnx/flow_estimator.onnx", "onnx/vocoder.onnx",
          ]
          source=Path(snapshot_download(
              repo_id="loudreader/loudr-1-turbo",
              allow_patterns=required,
          ))
          target=Path("android-project/app/src/main/assets/loudkit")
          for relative in required:
              original=source/relative
              if not original.is_file():
                  raise RuntimeError(f"Arquivo obrigatorio da voz Ines ausente: {relative}")
              destination=target/relative
              destination.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(original,destination)
          total=sum(f.stat().st_size for f in target.rglob("*") if f.is_file())
          print(f"Modelo Ines selecionado: {total/1024**2:.1f} MiB")
          if total > 2_500_000_000:
              raise RuntimeError("Modelo de voz acima do limite de seguranca de empacotamento")
          PY
      - name: Compilar JNI Loudkit Ines ARM64 e incluir ONNX Runtime
        run: |
          set -euo pipefail
          rustup target add aarch64-linux-android
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          export CC_aarch64_linux_android="$CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER"
          export AR_aarch64_linux_android="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          git clone --depth 1 --branch v0.1.1 https://github.com/loudreader/loudkit.git /tmp/iris-loudkit
          cd /tmp/iris-loudkit/rust
          cp "$GITHUB_WORKSPACE/iris-native/iris_ines_bridge.rs" src/iris_ines_bridge.rs
          printf '\nmod iris_ines_bridge;\n' >> src/lib.rs
          printf '\n[lib]\ncrate-type = ["cdylib", "rlib"]\n' >> Cargo.toml
          cargo add jni@0.21
          cargo build --release --target aarch64-linux-android --lib
          dest="$GITHUB_WORKSPACE/android-project/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$dest"
          cp target/aarch64-linux-android/release/libloudkit.so "$dest/"
          cd "$GITHUB_WORKSPACE"
          curl -fL --retry 3 -o /tmp/onnxruntime.aar https://repo1.maven.org/maven2/com/microsoft/onnxruntime/onnxruntime-android/1.27.0/onnxruntime-android-1.27.0.aar
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          with ZipFile("/tmp/onnxruntime.aar") as z:
              matches=[n for n in z.namelist() if n.endswith("/arm64-v8a/libonnxruntime.so")]
              assert matches, "ONNX Runtime Android ARM64 ausente"
              target=Path("android-project/app/src/main/jniLibs/arm64-v8a/libonnxruntime.so")
              target.write_bytes(z.read(matches[0]))
          PY
      - name: Auditar recursos da Iris no APK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          base=Path("android-project/app/src/main")
          kotlin=base/"java/com/iris/assistant"
          required=["IrisVoiceService.kt","IrisFixedVoice.kt","IrisInesSpeech.kt","IrisMemory.kt","IrisIntent.kt","IrisStatisticalModel.kt","IrisDeviceControl.kt","IrisHudView.kt","IrisTrigramGenerator.kt","IrisAudioGate.kt","IrisOneEuro.kt","IrisClapDetector.kt","IrisAudioLevel.kt","IrisCameraGestures.kt","IrisHandLandmarks.kt","IrisSoundscape.kt","IrisJarvisToolkit.kt","IrisCapabilities.kt","IrisVoiceDiagnostics.kt"]
          missing=[name for name in required if not (kotlin/name).is_file()]
          assert not missing, f"Arquivos Android faltando: {missing}"
          weights=base/"assets/iris-lm-weights.json"
          if weights.is_file():
              import json
              data=json.loads(weights.read_text(encoding="utf-8"))
              assert all(data.get(k) for k in ("topic","mood","gen")), "Modelo Iris incompleto"
              print("Modelo original Iris: pesos presentes e JSON validado")
          else:
              raise RuntimeError("Pesos estatisticos originais nao incluidos no APK")
          print("Arquivos Kotlin obrigatorios presentes:",len(required))
          PY
      - name: Aplicar icone oficial da IRIS no Android
        env:
          IRIS_ICON_URL: 'https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F86b61845-b0e6-426f-9fef-590b58ea45b2/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAI9cibAob9FGNPk6zw4wWDVjXwGPjV8y8C9YcO_KuEds&exp=1793886335&osig=AAAAAAAAAAAAAAAAAAAAAHtdb_GM5im8KAoWkdA0shNOgDNvLgWdenQtuDHZHhlR&signer=media-rpc&token=AAIAAU0AJDg2YjYxODQ1LWIwZTYtNDI2Zi05ZmVmLTU5MGI1OGVhNDViMgAAAAABoav1MBi-KBZSYecDq0Bbm1XNYrwtjSKvKvQD4q7vqAIIyxPcFQ&x-canva-quality=thumbnail'
        run: |
          set -euo pipefail
          if [ ! -f iris-ui/iris_icon.png ]; then
            curl -fLsS --retry 3 "$IRIS_ICON_URL" -o iris-ui/iris_icon.png
            file iris-ui/iris_icon.png | grep -q 'PNG image data'
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add iris-ui/iris_icon.png
            git commit -m 'Adicionar imagem oficial da IRIS ao repositorio'
            git push origin HEAD:main
          fi
          python3 - <<'PY'
          from pathlib import Path
          import re, shutil
          base=Path('android-project/app/src/main')
          dest=base/'res/drawable-nodpi/iris_launcher.png'
          dest.parent.mkdir(parents=True,exist_ok=True)
          shutil.copy2('iris-ui/iris_icon.png',dest)
          manifest=base/'AndroidManifest.xml'
          content=manifest.read_text()
          content,n=re.subn(r'(<application\b[^>]*?)\sandroid:icon="[^"]*"',r'\1 android:icon="@drawable/iris_launcher"',content,count=1)
          if not n:
              content,n=re.subn(r'<application\b',r'<application android:icon="@drawable/iris_launcher"',content,count=1)
          if not n: raise RuntimeError('Elemento application nao encontrado')
          manifest.write_text(content)
          print('Icone oficial IRIS aplicado:',dest.stat().st_size,'bytes')
          PY
      - name: Compilar APK debug da Iris
        working-directory: android-project
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Publicar APK para teste
        uses: actions/upload-artifact@v4
        with:
          name: iris-android-iris-neural
          path: android-project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
