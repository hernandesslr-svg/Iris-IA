name: Compilar Iris Galeria APK
on:
  push:
    branches:
      - iris-galeria
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Instalar componentes Android
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
      - name: Preparar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true
      - name: Diagnosticar ambiente
        run: |
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la iris-galeria/android
      - name: Instalar fotos do pacote na galeria
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, shutil, zipfile
          from pathlib import Path
          archive = Path("iris-galeria-personagens-selecionadas.zip")
          if not archive.is_file():
              raise SystemExit("Pacote de fotos não encontrado na raiz do repositório")
          target = Path("iris-galeria/android/app/src/main/assets/fotos")
          target.mkdir(parents=True, exist_ok=True)
          temp = Path("/tmp/iris-fotos-extraidas")
          shutil.rmtree(temp, ignore_errors=True)
          temp.mkdir(parents=True)
          with zipfile.ZipFile(archive) as z:
              z.extractall(temp)
          images = sorted(temp.rglob("*.webp"))
          if not images:
              raise SystemExit("Nenhuma imagem WebP encontrada no ZIP")
          manifest = []
          for source in images:
              dest = target / source.name
              shutil.copy2(source, dest)
              manifest.append({"file": dest.name, "name": source.stem})
          (target / "manifest.json").write_text(json.dumps(manifest, ensure_ascii=False), encoding="utf-8")
          print(f"{len(manifest)} fotos instaladas em {target}")
          PY
          test "$(find iris-galeria/android/app/src/main/assets/fotos -maxdepth 1 -name '*.webp' | wc -l)" -gt 0
      - name: Compilar APK
        working-directory: iris-galeria/android
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace --console=plain --warning-mode all --refresh-dependencies :app:assembleDebug 2>&1 | tee build.log
      - name: Diagnostico de falha
        if: failure()
        run: |
          echo "Etapas anteriores falharam. Verifique os logs desta execucao."
          find iris-galeria/android -maxdepth 5 -type f \( -name "*.log" -o -name "*.html" \) -print || true
      - name: Publicar diagnostico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Iris-Galeria-build-log
          path: iris-galeria/android/build.log
          if-no-files-found: warn
          retention-days: 30
      - name: Verificar APK
        run: test -s iris-galeria/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Iris-Galeria-debug-apk
          path: iris-galeria/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
