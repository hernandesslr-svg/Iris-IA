name: Compilar Iris Galeria APK
on:
  workflow_dispatch:
  push:
    branches: [iris-galeria]
    paths:
      - 'iris-galeria/android/**'
      - '.github/workflows/iris-galeria-android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iris-galeria/android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Instalar SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Iris-Galeria-debug-apk
          path: iris-galeria/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
