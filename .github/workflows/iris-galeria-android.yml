name: Compilar Iris Galeria APK
on:
  workflow_dispatch:
  push:
    branches: [iris-galeria]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iris-galeria/android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Preparar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          sdkmanager --list_installed
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace --info 2>&1 | tee build.log
      - name: Publicar log de compilação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Iris-Galeria-build-log
          path: iris-galeria/android/build.log
          if-no-files-found: warn
          retention-days: 30
      - name: Conferir arquivo APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Iris-Galeria-debug-apk
          path: iris-galeria/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
